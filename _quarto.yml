project:
  type: website
  output-dir: docs   # GitHub Pages can serve /docs; or use the included gh-pages workflow
  resources:         # copy project assets that only site.html (not a .qmd) references
    - "projects/*/images/*"
    - "projects/*/videos/*"
    - "projects/*/docs/*"

website:
  title: "YN/MECH"
  navbar:
    right:
      - {href: index.qmd, text: Home}
      - {href: projects.qmd, text: Projects}
      - {href: resume.qmd, text: "Résumé"}
      - {href: about.qmd, text: About}
  page-footer:
    center: |
      <p class="footer-cta">Let’s build something.</p>
      <a href="mailto:you@university.edu">Email</a> · <a href="https://linkedin.com/in/yourname">LinkedIn</a> · <a href="https://github.com/yourname">GitHub</a><br>
      <small>© 2026 Your Name</small>

format:
  html:
    theme:
      light: [default, custom-light.scss]
      dark: [default, custom-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    include-after-body: site.html
    toc: false
    smooth-scroll: true
