  navbar:
    logo: nko-logo-light.gif
    background: "#ffffff"          # Disable standard background
    search: false              # Hide search icon if not needed
    right:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Work Experiences"
        href: work.qmd
      - text: "CV"
