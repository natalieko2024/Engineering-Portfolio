project:
  type: website
  output-dir: docs   # GitHub Pages can serve /docs; or use the included gh-pages workflow
  resources:
    - "projects/*/images/*"
    - "projects/*/videos/*"
    - "projects/*/docs/*"

website:
  title: "NK/MECH"
  site-url: "https://natalieko.github.io/Engineering-Portfolio"
  navbar:
    right:
      - {href: index.qmd, text: Home}
      - {href: projects.qmd, text: Projects}
      - {href: resume.qmd, text: "CV"}
      - {href: about.qmd, text: About}
  page-footer:
    center: |
      <p class="footer-cta">Let's build something!</p>
      <a href="https://www.linkedin.com/in/ko12nat/" target="_blank">LinkedIn</a> · <a href="https://github.com/natalieko2024" target="_blank">GitHub</a><br>
      <small>© 2026 Natalie Ko. All rights reserved.</small>

format:
  html:
    theme:
      light: [default, custom-light.scss]
      dark: [default, custom-dark.scss]
    respect-user-color-scheme: true
    css: styles.css
    include-after-body: site.html
    toc: false
    smooth-scroll: true
